name: Monitor SignUpGenius Content

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: https://www.signupgenius.com/go/10c0d4faba62ca2f9c25-euttc
    steps:
      - name: Read stored content hash
        id: previous_hash
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'SIGNUPGENIUS_CONTENT_HASH'
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/actions/variables/{name}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name
              })
              core.setOutput('hash', response.data.value)
            } catch (error) {
              if (error.status === 404) {
                core.info('No stored content hash found.')
                core.setOutput('hash', '')
              } else {
                throw error
              }
            }

      - name: Fetch booking page content
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "$TARGET_URL" -o page.html

      - name: Compute content hash
        id: content_hash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          class TextExtractor(HTMLParser):
              def __init__(self) -> None:
                  super().__init__()
                  self.chunks = []
                  self._skip_depth = 0
                  self._skip_tags = {"script", "style", "noscript", "svg", "iframe"}

              def handle_starttag(self, tag, attrs):
                  if tag in self._skip_tags:
                      self._skip_depth += 1

              def handle_endtag(self, tag):
                  if tag in self._skip_tags and self._skip_depth > 0:
                      self._skip_depth -= 1

              def handle_data(self, data):
                  if self._skip_depth == 0:
                      self.chunks.append(data)

          raw_html = Path("page.html").read_text(encoding="utf-8", errors="ignore")
          parser = TextExtractor()
          parser.feed(raw_html)
          text = " ".join(parser.chunks)
          normalized = re.sub(r"\s+", " ", text).strip()
          digest = hashlib.sha256(normalized.encode("utf-8")).hexdigest()
          Path(".content-hash").write_text(digest)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"hash={digest}\n")
          PY

      - name: Compare content hashes
        id: compare
        run: |
          if [ -z "${{ steps.previous_hash.outputs.hash }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.previous_hash.outputs.hash }}" = "${{ steps.content_hash.outputs.hash }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger signup workflow on change
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            core.info('Detected updated content. Dispatching weekly signup workflow.')
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly_signup.yml',
              ref: 'main'
            })

      - name: Store latest content hash
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          CONTENT_HASH: ${{ steps.content_hash.outputs.hash }}
        with:
          script: |
            const name = 'SIGNUPGENIUS_CONTENT_HASH'
            const value = process.env.CONTENT_HASH
            try {
              await github.request('PATCH /repos/{owner}/{repo}/actions/variables/{name}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                value
              })
            } catch (error) {
              if (error.status === 404) {
                await github.request('POST /repos/{owner}/{repo}/actions/variables', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  value
                })
              } else {
                throw error
              }
            }

      - name: Report unchanged content
        if: steps.compare.outputs.changed != 'true'
        run: echo "No content change detected."
